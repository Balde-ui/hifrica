# Seul Caddy publie des ports (80/443). La base et Valkey ne sont jamais exposés : Docker contourne ufw.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SIM_DOMAIN: ${SIM_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, engine]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379
    depends_on: [db, valkey]

  engine:
    build: { context: ., dockerfile: apps/engine/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4000"
      SIMULATORS_DIR: /simulators
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379
    volumes:
      - ./simulators:/simulators:ro
    depends_on: [db, valkey]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data

volumes:
  caddy_data:
  caddy_config:
  db_data:
  valkey_data:
