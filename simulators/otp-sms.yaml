name: otp-sms
version: 1.0.0
description: Envoi d'un code de vérification à usage unique par SMS (OTP), aucun opérateur réel reproduit.
kind: http
auth: bearer
endpoints:
  - id: send-otp
    method: POST
    path: /v1/otp
    response:
      status: 201
      body: { id: "{{uuid}}", status: "sent", code: "123456" }
    phone:
      screen: sms
      from: HIFRICA
      to: "{{body.phone}}"
      text: "Votre code de vérification Hifrica est {{response.code}}. Ne le partagez avec personne."
